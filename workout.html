<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Workout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="workout">
  <main class="app top">
    <section class="panel">
      <a class="back" href="index.html">← Home</a>
      <h1>Workout</h1>

      <div class="day-bar">
        <input id="date" type="date" aria-label="Workout date">
        <button id="today" class="btn ghost small" type="button">Today</button>
      </div>
      <p id="status" class="status" role="status"></p>

      <div id="exercises"></div>
      <p id="empty" class="empty">No exercises for this day yet. Add one below.</p>

      <form id="add-form" class="add-exercise" autocomplete="off">
        <input id="ex-name" type="text" list="ex-names" placeholder="Add exercise, e.g. Squat"
               enterkeyhint="done" aria-label="Exercise name" maxlength="60">
        <datalist id="ex-names"></datalist>
        <button class="btn primary" type="submit">Add</button>
      </form>

      <p class="section-label">History</p>
      <ul id="history" class="history"></ul>

      <p class="section-label">Data</p>
      <div class="card data-card">
        <div class="field">
          <label for="unit">Weight unit</label>
          <select id="unit">
            <option value="lb">lb</option>
            <option value="kg">kg</option>
          </select>
        </div>
        <div class="data-tools">
          <button id="export" class="btn secondary" type="button">Export backup</button>
          <button id="import" class="btn secondary" type="button">Import backup</button>
          <input id="import-file" type="file" accept=".json,application/json" hidden>
        </div>
        <p id="backup-note" class="note"></p>
      </div>
    </section>
  </main>

  <script src="workout.js"></script>
</body>
</html>
